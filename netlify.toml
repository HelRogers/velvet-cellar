# Netlify configuration for The Velvet Cellar.
#
# The site is currently deployed by manual upload of the built folder (see
# docs/DEPLOYING.md), so this file is not read yet. It is here so that connecting a
# GitHub repository later needs no changes: Netlify will build the same folder.
#
# Response headers live in public/_headers, which works for both kinds of deploy.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
